<div class="container py-4">
  <div class="row">
    <div class="col-lg-8">
      <h2 class="text-light mb-4">
        {{ isEditMode ? "Edit Announcement" : "New Announcement" }}
      </h2>

      @if (error()) {
        <div class="alert alert-danger" role="alert">
          {{ error() }}
          @if (isEditMode && !canEdit()) {
            <button type="button" class="btn btn-sm btn-outline-danger ms-2" (click)="retryLoad()" [disabled]="isLoading()">Retry loading</button>
          }
        </div>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="title" class="form-label text-light">Title</label>
          <input
            type="text"
            id="title"
            class="form-control"
            [(ngModel)]="title"
            name="title"
            required
            [disabled]="!canEdit() || isLoading()"
            (ngModelChange)="onFieldChange('title', $event)"
          />
        </div>

        <div class="mb-3">
          <label for="image" class="form-label text-light">Image URL</label>
          <input
            type="text"
            id="image"
            class="form-control"
            [(ngModel)]="image"
            name="image"
            [disabled]="!canEdit() || isLoading()"
            (ngModelChange)="onFieldChange('image', $event)"
          />
        </div>

        <div class="mb-3">
          <label for="category" class="form-label text-light">Category</label>
          <input
            type="text"
            id="category"
            class="form-control"
            [(ngModel)]="category"
            name="category"
            [disabled]="!canEdit() || isLoading()"
            (ngModelChange)="onFieldChange('category', $event)"
          />
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="duration" class="form-label text-light">Duration</label>
            <input
              type="text"
              id="duration"
              class="form-control"
              [(ngModel)]="duration"
              name="duration"
              [disabled]="!canEdit() || isLoading()"
              (ngModelChange)="onFieldChange('duration', $event)"
            />
          </div>
          <div class="col-md-6">
            <label for="button" class="form-label text-light"
              >Button Text</label
            >
            <input
              type="text"
              id="button"
              class="form-control"
              [(ngModel)]="button"
              name="button"
              [disabled]="!canEdit() || isLoading()"
              (ngModelChange)="onFieldChange('button', $event)"
            />
          </div>
        </div>

        <div class="mb-3">
          <label for="text" class="form-label text-light"
            >Content (Markdown)</label
          >
          <textarea
            id="text"
            class="form-control"
            rows="15"
            [(ngModel)]="text"
            name="text"
            required
            [disabled]="!canEdit() || isLoading()"
            (ngModelChange)="onFieldChange('text', $event)"
          ></textarea>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-info" [disabled]="!canSave()">
            @if (isLoading()) {
              <span
                class="spinner-border spinner-border-sm me-2"
                role="status"
                ><span class="visually-hidden">{{ isEditMode && !canEdit() ? "Loading…" : "Saving…" }}</span></span
              >
            }
            {{ isEditMode ? "Update" : "Create" }}
          </button>
          <a routerLink="/admin" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>

    <div class="col-lg-4">
      <div class="card bg-dark text-light">
        <div
          class="card-header d-flex justify-content-between align-items-center"
        >
          <span>Preview</span>
          <div>
            <button
              class="btn btn-sm btn-outline-secondary me-1"
              (click)="undo()"
              [disabled]="!canEdit() || isLoading() || !canUndo()"
              title="Undo"
              aria-label="Undo"
            >
              <i class="fas fa-undo"></i>
            </button>
            <button
              class="btn btn-sm btn-outline-secondary"
              (click)="redo()"
              [disabled]="!canEdit() || isLoading() || !canRedo()"
              title="Redo"
              aria-label="Redo"
            >
              <i class="fas fa-redo"></i>
            </button>
          </div>
        </div>
        <div class="card-body">
          @if (title) {
            <h5>{{ title }}</h5>
          }
          @if (image) {
            <img [src]="image" class="img-fluid rounded mb-3" [alt]="title" />
          }
          @if (category) {
            <span class="badge bg-info mb-2">{{ category }}</span>
          }
          @if (text) {
            <div [innerHTML]="text | markdown"></div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
