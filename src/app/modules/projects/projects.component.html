<section class="bg-dark-blog">
  <div class="container py-4">
    <h1 class="h1 text-center text-white mb-4">Projects</h1>

    @if (isLoading()) {
      <div class="text-center py-5">
        <div class="spinner-border text-info" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    } @else if (error()) {
      <div class="alert alert-warning">{{ error() }}</div>
    } @else {
      @if (projects().length === 0) {
        <div class="text-center text-light py-5">
          <p>No projects yet.</p>
        </div>
      } @else {
        <div class="row">
          @for (project of projects(); track trackById($index, project)) {
            <div class="col-md-4 mb-4">
              <a
                [routerLink]="['/projects', project.id]"
                class="text-decoration-none"
              >
                <div class="card bg-dark text-light h-100 project-card">
                  <img
                    [src]="project.image"
                    class="card-img-top"
                    [alt]="project.title"
                    style="height: 200px; object-fit: cover"
                  />
                  <div class="card-body">
                    <h5 class="card-title">{{ project.title }}</h5>
                    <p class="card-text text-muted">
                      {{ project.shortDescription }}
                    </p>
                    <span class="badge bg-info">{{ project.author }}</span>
                  </div>
                </div>
              </a>
            </div>
          }
        </div>
      }
    }
  </div>
</section>
