<section class="bg-dark-blog">
  <div class="container py-4">
    <h1 class="h1 text-center text-white mb-4">Categories</h1>

    @if (isLoading()) {
      <div class="text-center py-5">
        <div class="spinner-border text-info" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    } @else if (error()) {
      <div class="alert alert-warning">{{ error() }}</div>
    } @else if (categories()!.length === 0) {
      <div class="text-center text-light py-5">
        <p>
          No categories yet. Create your first announcement with a category!
        </p>
      </div>
    } @else {
      <div class="row">
        @for (category of categories()!; track category) {
          <div class="col-md-4 mb-4">
            <a
              [routerLink]="['/category', category]"
              class="text-decoration-none"
            >
              <div class="card bg-dark text-light h-100 project-card">
                <div
                  class="card-body d-flex flex-column justify-content-center align-items-center py-5"
                >
                  <i class="fas fa-tag fa-2x text-info mb-3"></i>
                  <h5 class="card-title">{{ category }}</h5>
                </div>
              </div>
            </a>
          </div>
        }
      </div>
    }
  </div>
</section>
